# Render blueprint for Cravr's two independent services. Deploy via Render's
# "New +" -> "Blueprint" pointing at this repo, or create each web service
# by hand using the settings below.
#
# IMPORTANT: Render assigns each service's *.onrender.com URL from whatever
# name you actually give it at creation time, and that name must be
# globally unique across every Render account -- the names below may
# already be taken, in which case Render appends a random suffix and your
# real URL differs from the one guessed here. Create the "cravr-app"
# service first, copy the URL Render actually shows you, THEN set
# SWIGGY_REDIRECT_URI to match it if it differs, and submit that exact URL
# (with /oauth/callback appended) to Swiggy for whitelisting -- not a
# guessed one.
services:
  # The chat UI + the Swiggy OAuth callback, combined (see server.py). This
  # is the service whose URL gets whitelisted with Swiggy.
  - type: web
    name: cravr-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      # Where this service reaches the mock-data tool server (see the
      # cravr-mock-mcp service below). Defaults to localhost, which only
      # works when both run on one machine -- once cravr-mock-mcp is
      # deployed on Render too, this must point at its real public URL +
      # "/mcp", or every tool call (recommendations, order history,
      # preferences) will fail even though the chat UI itself loads fine.
      - key: CRAVR_MCP_URL
        sync: false
      # Only matters for whitelisting -- it's what /oauth/login sends to
      # Swiggy and must exactly match what's on file with Builders Club.
      # Defaults to https://cravr-app.onrender.com/oauth/callback (see
      # mcp_server/oauth.py) -- only set this if your actual Render URL for
      # this service ends up different from that.
      - key: SWIGGY_REDIRECT_URI
        sync: false
      # Base URL of Swiggy's MCP server, where /oauth/login starts OAuth
      # metadata discovery (RFC 9728 / RFC 8414) and dynamic client
      # registration (RFC 7591). Defaults to https://mcp.swiggy.com in code
      # (mcp_server/oauth.py) -- leave unset unless that changes.
      - key: SWIGGY_MCP_URL
        sync: false
      # Space-separated OAuth scopes. Defaults to Swiggy's three documented
      # scopes ("mcp:tools mcp:resources mcp:prompts") in code -- leave
      # unset unless you need something different.
      - key: SWIGGY_SCOPES
        sync: false

  # The mock-data MCP tool server -- stands in for Swiggy's real MCP tools
  # while building/testing. Deliberately separate and Swiggy-agnostic: no
  # public whitelisting, no OAuth, nothing riding on it. Once real Swiggy
  # MCP access exists, delete this service (and, if you like, the
  # mcp_server/ directory) and point cravr-app's CRAVR_MCP_URL at Swiggy's
  # real endpoint instead -- that's the entire migration.
  - type: web
    name: cravr-mock-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python mcp_server/run_mcp.py
