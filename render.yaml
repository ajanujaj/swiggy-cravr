# Render blueprint for Cravr's two services. Deploy via "New +" -> "Blueprint",
# or create each web service by hand using the settings below.
#
# Render assigns each service's *.onrender.com URL from its name at creation
# time; if "cravr-app" is taken, Render appends a suffix and your real URL
# differs from the one assumed here. Update SWIGGY_REDIRECT_URI to match if so,
# and submit that exact URL (+ /oauth/callback) to Swiggy for whitelisting.
services:
  - type: web
    name: cravr-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      # Points at cravr-mock-mcp's URL + "/mcp" for now; switch to
      # https://mcp.swiggy.com/food once real Swiggy access is live.
      - key: CRAVR_MCP_URL
        sync: false
      # Must match what's whitelisted with Swiggy. Defaults to
      # https://cravr-app.onrender.com/oauth/callback in code.
      - key: SWIGGY_REDIRECT_URI
        sync: false
      # Defaults to https://mcp.swiggy.com in code -- leave unset unless it changes.
      - key: SWIGGY_MCP_URL
        sync: false
      # Defaults to "mcp:tools mcp:resources mcp:prompts" in code.
      - key: SWIGGY_SCOPES
        sync: false

  # Mock-data MCP tool server, standing in for Swiggy's real Food MCP.
  # Once real access exists: stop deploying this and point cravr-app's
  # CRAVR_MCP_URL at https://mcp.swiggy.com/food instead.
  - type: web
    name: cravr-mock-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python mcp_server/run_mcp.py
